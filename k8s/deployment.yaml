apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-blueprint-designer
  namespace: default
  labels:
    app: k8s-blueprint-designer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-blueprint-designer
  template:
    metadata:
      labels:
        app: k8s-blueprint-designer
    spec:
      serviceAccountName: k8s-discovery-engine
      containers:
      - name: backend
        image: k8s-blueprint-designer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: api
        - containerPort: 3000
          name: frontend
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-blueprint-designer
  namespace: default
  labels:
    app: k8s-blueprint-designer
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    name: frontend
  - port: 8080
    targetPort: 8080
    name: api
  selector:
    app: k8s-blueprint-designer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-discovery-engine
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-discovery-engine
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-discovery-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-discovery-engine
subjects:
- kind: ServiceAccount
  name: k8s-discovery-engine
  namespace: default

